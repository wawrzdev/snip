name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - name: Test, including completion drift
        run: go test -count=1 ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  archlinux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git go
      - uses: actions/checkout@v7
      - run: test -z "$(gofmt -l .)"
      - name: Test, including completion drift
        run: go test -count=1 ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate draft asset contract
        run: node --test .github/scripts/release-contract.test.cjs
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: 'v2.18.1'
          args: check
