name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: ./scripts/generate-completions.sh && git diff --exit-code -- completions
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  archlinux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git go
      - uses: actions/checkout@v7
      - run: test -z "$(gofmt -l .)"
      - run: ./scripts/generate-completions.sh && git diff --exit-code -- completions
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: check
