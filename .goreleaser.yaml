version: 2

project_name: snip

before:
  hooks:
    - ./scripts/generate-completions.sh
    - git diff --exit-code -- completions
    - go test -count=1 ./...

builds:
  - id: snip
    main: ./cmd/snip
    binary: snip
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: archives
    ids: [snip]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - completions/*

nfpms:
  - id: native-packages
    ids: [snip]
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    package_name: snip
    vendor: wawrzdev
    homepage: https://github.com/wawrzdev/snip
    maintainer: Kris Wawrzyniak <wawrz.dev@gmail.com>
    description: Manage GitHub gists and account-level GitLab snippets as local Git clones.
    license: MIT
    formats:
      - deb
      - archlinux
    bindir: /usr/bin
    dependencies:
      - git
      - fzf
      - gh
    overrides:
      archlinux:
        dependencies:
          - git
          - fzf
          - github-cli
    archlinux:
      packager: Kris Wawrzyniak <wawrz.dev@gmail.com>
    contents:
      - src: completions/_snip
        dst: /usr/share/zsh/site-functions/_snip
      - src: completions/snip.bash
        dst: /usr/share/bash-completion/completions/snip
      - src: completions/snip.fish
        dst: /usr/share/fish/vendor_completions.d/snip.fish

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  # Upload and verify all nine assets before the workflow publishes the immutable release.
  draft: true
  target_commitish: "{{ .Commit }}"
  github:
    owner: wawrzdev
    name: snip
